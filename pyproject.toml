[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-understanding-dte"
version = "0.1.0"
description = "Interventional tests of temporal understanding using dynamic treatment effects"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "seaborn>=0.13"]

[project.optional-dependencies]
foundation = ["torch>=2.2", "chronos-forecasting>=2.0"]
torch = ["torch>=2.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
